<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a2238"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#f7f8fb"/>
  <text x="64" y="64" font-size="34" font-weight="700" fill="#1a2238">Flujo end-to-end — crear un auto</text>
  <text x="64" y="96" font-size="18" fill="#5b6478">El mismo dominio y casos de uso sin importar que la entrada sea HTTP o la salida sea SQL Server.</text>

  <!-- Zones -->
  <rect x="40" y="130" width="370" height="520" rx="14" fill="#eef2ff" stroke="#c7d2fe"/>
  <rect x="455" y="130" width="430" height="520" rx="14" fill="#ecfdf5" stroke="#a7f3d0"/>
  <rect x="930" y="130" width="310" height="520" rx="14" fill="#fef3f2" stroke="#fecaca"/>
  <text x="225" y="162" text-anchor="middle" font-size="17" font-weight="700" fill="#4338ca">BROWSER · Angular</text>
  <text x="670" y="162" text-anchor="middle" font-size="17" font-weight="700" fill="#047857">BACKEND · Spring Boot</text>
  <text x="1085" y="162" text-anchor="middle" font-size="17" font-weight="700" fill="#b91c1c">SQL Server</text>

  <!-- Browser boxes -->
  <g font-size="14" fill="#1a2238">
    <rect x="70" y="185" width="310" height="46" rx="8" fill="#fff" stroke="#818cf8"/>
    <text x="225" y="213" text-anchor="middle" font-weight="600">Componente (modal Add car)</text>
    <rect x="70" y="251" width="310" height="46" rx="8" fill="#fff" stroke="#818cf8"/>
    <text x="225" y="279" text-anchor="middle" font-weight="600">CreateCarUseCase</text>
    <rect x="70" y="317" width="310" height="46" rx="8" fill="#fff" stroke="#818cf8"/>
    <text x="225" y="338" text-anchor="middle" font-weight="600">CarRepositoryPort <tspan font-size="11" fill="#6366f1">(puerto)</tspan></text>
    <text x="225" y="354" text-anchor="middle" font-size="11" fill="#6366f1">→ CarHttpAdapter</text>
    <rect x="70" y="383" width="310" height="56" rx="8" fill="#312e81"/>
    <text x="225" y="406" text-anchor="middle" font-weight="700" fill="#fff" font-size="13">jwtInterceptor</text>
    <text x="225" y="425" text-anchor="middle" fill="#c7d2fe" font-size="12">agrega  Authorization: Bearer &lt;token&gt;</text>
  </g>

  <!-- vertical arrows browser -->
  <g stroke="#4338ca" stroke-width="2" marker-end="url(#a)">
    <line x1="225" y1="231" x2="225" y2="249"/>
    <line x1="225" y1="297" x2="225" y2="315"/>
    <line x1="225" y1="363" x2="225" y2="381"/>
  </g>

  <!-- cross arrow to backend -->
  <line x1="380" y1="411" x2="610" y2="208" stroke="#1a2238" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="495" y="300" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2238" transform="rotate(-41 495 300)">POST /api/cars</text>

  <!-- Backend boxes -->
  <g font-size="14" fill="#1a2238">
    <rect x="485" y="185" width="370" height="46" rx="8" fill="#34d399"/>
    <text x="670" y="207" text-anchor="middle" font-weight="700" fill="#053b2c">JwtAuthenticationFilter</text>
    <text x="670" y="223" text-anchor="middle" font-size="11" fill="#065f46">valida firma → extrae userId del sub</text>
    <rect x="485" y="251" width="370" height="46" rx="8" fill="#fff" stroke="#34d399"/>
    <text x="670" y="279" text-anchor="middle" font-weight="600">CarController <tspan font-size="11" fill="#059669">(adapter in)</tspan></text>
    <rect x="485" y="317" width="370" height="46" rx="8" fill="#fff" stroke="#34d399"/>
    <text x="670" y="345" text-anchor="middle" font-weight="600">CreateCarUseCase <tspan font-size="11" fill="#059669">(puerto in)</tspan></text>
    <rect x="485" y="383" width="370" height="56" rx="8" fill="#fff" stroke="#34d399"/>
    <text x="670" y="406" text-anchor="middle" font-weight="600">CarService <tspan font-size="11" fill="#059669">(caso de uso)</tspan></text>
    <text x="670" y="425" text-anchor="middle" font-size="11" fill="#065f46">placa única + Car.create() valida invariantes</text>
    <rect x="485" y="459" width="370" height="46" rx="8" fill="#fff" stroke="#34d399"/>
    <text x="670" y="487" text-anchor="middle" font-weight="600">CarRepositoryPort.save() <tspan font-size="11" fill="#059669">(puerto out)</tspan></text>
    <rect x="485" y="525" width="370" height="56" rx="8" fill="#fff" stroke="#34d399"/>
    <text x="670" y="548" text-anchor="middle" font-weight="600">CarPersistenceAdapter</text>
    <text x="670" y="567" text-anchor="middle" font-size="11" fill="#065f46">Car (dominio) → CarJpaEntity</text>
  </g>
  <g stroke="#047857" stroke-width="2" marker-end="url(#a)">
    <line x1="670" y1="231" x2="670" y2="249"/>
    <line x1="670" y1="297" x2="670" y2="315"/>
    <line x1="670" y1="363" x2="670" y2="381"/>
    <line x1="670" y1="439" x2="670" y2="457"/>
    <line x1="670" y1="505" x2="670" y2="523"/>
  </g>

  <!-- cross to DB -->
  <line x1="855" y1="553" x2="1075" y2="320" stroke="#1a2238" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="980" y="450" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2238" transform="rotate(-47 980 450)">INSERT (Spring Data JPA)</text>

  <!-- DB box -->
  <rect x="960" y="250" width="250" height="120" rx="10" fill="#fff" stroke="#f87171"/>
  <text x="1085" y="282" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2238">tabla dbo.cars</text>
  <line x1="980" y1="296" x2="1190" y2="296" stroke="#fecaca"/>
  <text x="980" y="320" font-size="12" fill="#5b6478">id · user_id (FK) · brand · model</text>
  <text x="980" y="340" font-size="12" fill="#5b6478">year · plate_number · color · photo_url</text>
  <text x="980" y="360" font-size="12" fill="#b91c1c">UNIQUE (user_id, plate_number)</text>

  <text x="1085" y="430" text-anchor="middle" font-size="13" fill="#5b6478">schema fijo por init.sql</text>
  <text x="1085" y="450" text-anchor="middle" font-size="13" fill="#5b6478">(ddl-auto: none)</text>
</svg>
