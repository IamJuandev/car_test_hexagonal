<title>Diagramas — App de gestión de autos</title>
<style>
  :root { --ink:#1a2238; --muted:#5b6478; --line:#e2e8f0; }

         font-family:"Segoe UI",system-ui,-apple-system,sans-serif; }

         display:flex; flex-direction:column; gap:32px; }

           border-radius:14px; overflow:hidden; box-shadow:0 6px 24px rgba(26,34,56,.06); }

</style>
