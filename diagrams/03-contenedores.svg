<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a2238"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#f7f8fb"/>
  <text x="64" y="64" font-size="34" font-weight="700" fill="#1a2238">Dockerización con Apple container</text>
  <text x="64" y="96" font-size="18" fill="#5b6478">Tres contenedores reproducibles. Nada se instala en la máquina: ni Java, ni Maven, ni Node, ni SQL Server.</text>

  <!-- Host -->
  <rect x="48" y="130" width="1184" height="430" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="72" y="160" font-size="15" font-weight="700" fill="#475569">Mac (Apple Silicon · arm64) — puertos publicados al host</text>

  <!-- network band -->
  <rect x="80" y="350" width="1120" height="180" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="6 5"/>
  <text x="100" y="375" font-size="14" font-weight="700" fill="#64748b">red interna  car-app-net</text>

  <!-- Frontend container -->
  <rect x="110" y="200" width="300" height="150" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="260" y="232" text-anchor="middle" font-size="18" font-weight="700" fill="#3730a3">car-frontend</text>
  <text x="260" y="258" text-anchor="middle" font-size="14" fill="#4338ca">Angular → nginx</text>
  <text x="260" y="282" text-anchor="middle" font-size="13" fill="#6366f1">arm64 (build nativo, rápido)</text>
  <rect x="200" y="300" width="120" height="30" rx="6" fill="#6366f1"/>
  <text x="260" y="320" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">:4200</text>

  <!-- Backend container -->
  <rect x="490" y="200" width="300" height="150" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="640" y="232" text-anchor="middle" font-size="18" font-weight="700" fill="#047857">car-backend</text>
  <text x="640" y="258" text-anchor="middle" font-size="14" fill="#059669">Spring Boot · Java 21</text>
  <text x="640" y="282" text-anchor="middle" font-size="13" fill="#10b981">amd64</text>
  <rect x="580" y="300" width="120" height="30" rx="6" fill="#10b981"/>
  <text x="640" y="320" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">:8080</text>

  <!-- DB container -->
  <rect x="870" y="200" width="300" height="150" rx="12" fill="#fef3f2" stroke="#ef4444" stroke-width="2"/>
  <text x="1020" y="232" text-anchor="middle" font-size="18" font-weight="700" fill="#b91c1c">car-db</text>
  <text x="1020" y="258" text-anchor="middle" font-size="14" fill="#dc2626">SQL Server 2022</text>
  <text x="1020" y="282" text-anchor="middle" font-size="13" fill="#ef4444">amd64 (emulado) · 4 GB RAM · root</text>
  <rect x="960" y="300" width="120" height="30" rx="6" fill="#ef4444"/>
  <text x="1020" y="320" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">:1433</text>

  <!-- volume -->
  <rect x="870" y="430" width="300" height="62" rx="10" fill="#fff" stroke="#ef4444" stroke-dasharray="5 4"/>
  <text x="1020" y="458" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">volumen sqlserver-data</text>
  <text x="1020" y="478" text-anchor="middle" font-size="12" fill="#dc2626">los datos persisten entre reinicios</text>
  <line x1="1020" y1="350" x2="1020" y2="428" stroke="#ef4444" stroke-width="2" marker-end="url(#a)"/>

  <!-- arrows: browser to backend via host, backend to db over net -->
  <line x1="410" y1="270" x2="488" y2="270" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="449" y="262" text-anchor="middle" font-size="11" fill="#64748b">el browser pega al</text>
  <text x="449" y="290" text-anchor="middle" font-size="11" fill="#64748b">backend vía host</text>

  <line x1="700" y1="440" x2="860" y2="440" stroke="#1a2238" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M640,350 L640,440 L700,440" fill="none" stroke="#047857" stroke-width="2"/>
  <text x="780" y="430" text-anchor="middle" font-size="12" font-weight="700" fill="#1a2238">DB_HOST = IP dinámica</text>

  <!-- gotchas / sequence -->
  <text x="64" y="600" font-size="17" font-weight="700" fill="#1a2238">Secuencia de ./scripts/container-up.sh</text>
  <text x="64" y="628" font-size="14" fill="#5b6478">1. Buildear TODAS las imágenes primero (un build rompe la red de los contenedores vivos)  ·  2. crear red + volumen</text>
  <text x="64" y="650" font-size="14" fill="#5b6478">3. levantar SQL Server y esperar  ·  4. aplicar init.sql + seed.sql (go-sqlcmd)  ·  5. resolver IP de la BD e inyectarla al backend  ·  6. levantar backend y frontend</text>
  <text x="64" y="678" font-size="13" fill="#94a3b8">Trampas resueltas: amd64 por emulación, ≥2 GB RAM, correr como root, go-sqlcmd para TLS de SQL 2022, enrutado solo entre misma arquitectura, sin DNS por nombre.</text>
</svg>
