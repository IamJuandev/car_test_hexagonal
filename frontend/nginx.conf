server {
    listen 4200;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Angular client-side routing: fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached: it is the file that names the current
    # hashed bundles. A stale copy keeps a browser on an old build of the app
    # even after a redeploy.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        expires off;
    }

    # Build outputs carry a content hash in their name, so a given URL always
    # answers with the same bytes and can be cached hard.
    location ~* \.(js|css|woff2?|png|jpe?g|webp|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
